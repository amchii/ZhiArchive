<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ZhiArchive 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101418;
        --panel: #151b21;
        --panel-soft: #1b232b;
        --border: #2b3640;
        --border-strong: #3b4a56;
        --text: #edf2f7;
        --muted: #93a3b1;
        --accent: #3dd6a5;
        --accent-dark: #18a77a;
        --danger: #ff7a7a;
        --danger-bg: #3a2224;
        --info-bg: #172b35;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(960px, 100%);
        min-height: 560px;
        display: grid;
        grid-template-columns: minmax(280px, 0.9fr) minmax(320px, 1.1fr);
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 24px 80px var(--shadow);
      }

      .summary {
        border-right: 1px solid var(--border);
        background: #12181e;
        padding: 34px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 28px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border: 1px solid var(--border-strong);
        display: grid;
        place-items: center;
        color: var(--accent);
        font-weight: 800;
        letter-spacing: 0;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        font-weight: 750;
        letter-spacing: 0;
      }

      .summary p,
      .field-note,
      .status-text {
        color: var(--muted);
        line-height: 1.65;
        font-size: 14px;
      }

      .status-list {
        display: grid;
        gap: 10px;
      }

      .status-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
      }

      .status-item strong {
        color: var(--text);
        font-weight: 650;
      }

      .content {
        padding: 46px;
        display: flex;
        align-items: center;
      }

      .login-panel,
      .logged-panel {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .panel-heading {
        display: grid;
        gap: 8px;
      }

      .panel-heading h2 {
        font-size: 24px;
        font-weight: 720;
        letter-spacing: 0;
      }

      .form-grid {
        display: grid;
        gap: 16px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 13px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--text);
        padding: 11px 12px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.16s ease, background 0.16s ease;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: var(--accent);
        background: #202a32;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      button,
      .btn {
        min-height: 42px;
        border: 1px solid transparent;
        padding: 10px 16px;
        color: #06110d;
        background: var(--accent);
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease,
          opacity 0.16s ease;
      }

      button:hover,
      .btn:hover {
        background: #5ee0b8;
      }

      button:disabled {
        opacity: 0.58;
        cursor: not-allowed;
      }

      .btn.secondary,
      button.secondary {
        color: var(--text);
        background: transparent;
        border-color: var(--border-strong);
      }

      .btn.secondary:hover,
      button.secondary:hover {
        background: var(--panel-soft);
      }

      .alert {
        border: 1px solid var(--border);
        padding: 12px 13px;
        font-size: 14px;
        line-height: 1.5;
      }

      .alert.error {
        border-color: #674044;
        background: var(--danger-bg);
        color: #ffd6d6;
      }

      .alert.info {
        border-color: #284653;
        background: var(--info-bg);
        color: #d8eef7;
      }

      .session-line {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .session-dot {
        width: 9px;
        height: 9px;
        background: var(--accent);
        border-radius: 50%;
      }

      @media (max-width: 780px) {
        body {
          padding: 0;
          place-items: stretch;
        }

        .shell {
          min-height: 100vh;
          grid-template-columns: 1fr;
          border: none;
        }

        .summary {
          border-right: none;
          border-bottom: 1px solid var(--border);
          padding: 24px;
        }

        .content {
          padding: 28px 24px 34px;
          align-items: flex-start;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="summary" aria-label="ZhiArchive 信息">
        <div class="brand">
          <div class="brand-mark">Z</div>
          <div>
            <h1>ZhiArchive</h1>
            <p>登录管理控制台，配置知乎登录态、监控任务与归档任务。</p>
          </div>
        </div>

        <div class="status-list" aria-label="登录说明">
          <div class="status-item">
            <span>认证范围</span>
            <strong>API 控制台</strong>
          </div>
          <div class="status-item">
            <span>凭证来源</span>
            <strong>.apienv</strong>
          </div>
          <div class="status-item">
            <span>登录后跳转</span>
            <strong>来源页面</strong>
          </div>
        </div>
      </section>

      <section class="content">
        <div class="login-panel" id="login-card">
          <div class="panel-heading">
            <h2>控制台登录</h2>
            <p class="status-text">请输入 API 管理员用户名和密码。</p>
          </div>

          {% if toast %}
          <div class="alert info">{{ toast }}</div>
          {% endif %}
          <div id="feedback" class="alert error" style="display: none"></div>

          <form id="login-form" class="form-grid" novalidate>
            <div>
              <label for="username">用户名</label>
              <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
              />
            </div>
            <div>
              <label for="password">密码</label>
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>
            <div class="actions">
              <button type="submit" id="submit-btn">登录</button>
              <span class="field-note">成功后自动回到目标页面</span>
            </div>
          </form>
        </div>

        <div class="logged-panel" id="logged-in-card" style="display: none">
          <div class="panel-heading">
            <h2>已登录</h2>
            <p class="status-text">当前浏览器已持有有效 API 登录态。</p>
          </div>
          <div class="alert info">
            <div class="session-line">
              <span class="session-dot"></span>
              <span>当前用户: <strong id="current-user"></strong></span>
            </div>
          </div>
          <div class="actions">
            <a href="/" class="btn">进入控制台</a>
            <button type="button" id="logout-btn" onclick="logout()" class="secondary">
              注销
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const feedback = document.getElementById('feedback');
      const submitBtn = document.getElementById('submit-btn');
      const defaultRedirect = {{ redirect_url | default('/') | tojson }};
      const loginUrl = {{ login_url | tojson }};
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect') || defaultRedirect;

      function showMessage(message) {
        feedback.textContent = message;
        feedback.style.display = 'block';
      }

      async function submitForm(event) {
        event.preventDefault();
        feedback.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';

        const data = {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        };

        try {
          const response = await fetch(loginUrl, {
            method: 'POST',
            body: JSON.stringify(data),
            headers: {'Content-Type': 'application/json'}
          });

          if (response.status <= 299) {
            window.location = redirectUrl;
            return;
          }

          if (response.status === 401) {
            const text = await response.text();
            showMessage(text || '用户名或密码错误');
            return;
          }

          showMessage('用户名或密码错误');
        } catch (error) {
          showMessage('登录失败，请重试。');
          console.error(error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '登录';
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        form.addEventListener('submit', submitForm);
        checkLogin();
      });

      async function checkLogin() {
        try {
          const res = await fetch('/auth/me');
          if (res.ok) {
            const data = await res.json();
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('logged-in-card').style.display = 'flex';
            document.getElementById('current-user').textContent = data.username;
          }
        } catch (e) {
          console.error('Login check failed:', e);
        }
      }

      function logout() {
        document.cookie = 'token=; Max-Age=0; path=/;';
        window.location.reload();
      }
    </script>
  </body>
</html>
