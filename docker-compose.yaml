# volumes 配置直接覆盖了 Dockerfile 中的 `/opt/zhi_archive`，注意当前用户权限。
services:
  api:
    image: zhi-archive:latest
    init: true
    ipc: host
    working_dir: /opt/zhi_archive
    command: bash run_api.sh
    volumes:
      - ./:/opt/zhi_archive
      - ./var:/opt/zhi_archive/var
      - ./states:/opt/zhi_archive/states
      - ./results:/opt/zhi_archive/results
      - ./logs:/opt/zhi_archive/logs
    ports:
      - "9090:9090"
    environment:
      monitor_headless: true
      archiver_headless: true
      reader_headless: true
      login_worker_headless: true
    mem_limit: ${APP_MEM_LIMIT:-100g}
