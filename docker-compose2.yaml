# volumes 配置直接覆盖了Dockerfile中的`/opt/zhi_archive`，注意你当前的用户权限
services:
  api:
    image: zhi-archive:latest
    working_dir: /opt/zhi_archive
    command: bash run_api.sh
    volumes:
      - ./:/opt/zhi_archive
    ports:
      - "9090:9090"


  all_workers:
    image: zhi-archive:latest
    init: true
    ipc: host
    working_dir: /opt/zhi_archive
    command: python run_all_workers_in_one.py
    volumes:
      - ./:/opt/zhi_archive
    environment:
      login_worker_headless: true
      monitor_headless: true
      archiver_headless: true
    mem_limit: ${ALL_WORKERS_MEM_LIMIT:-100g}
